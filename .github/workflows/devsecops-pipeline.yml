name: DevSecOps Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# Variáveis globais da pipeline
env:
  IMAGE_NAME: zero-trust-app
  REGISTRY: ghcr.io
  PYTHON_VERSION: "3.11"

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: SAST com Semgrep
  # Analisa o código antes de qualquer build
  # ─────────────────────────────────────────────
  sast:
    name: SAST - Semgrep
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # histórico completo pra análise diff

      - name: Executar Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/python
            p/owasp-top-ten
            p/secrets
            p/dockerfile
            p/kubernetes
          generateSarif: "1"
          publishToken: ${{ secrets.SEMGREP_APP_TOKEN }}
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        continue-on-error: false  # bloqueia se encontrar achados críticos

      - name: Upload resultado SARIF para GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep-sast

  # ─────────────────────────────────────────────
  # JOB 2: Geração de SBOM
  # Gera inventário completo de dependências
  # ─────────────────────────────────────────────
  sbom-generation:
    name: SBOM - Syft
    runs-on: ubuntu-latest
    needs: sast
    permissions:
      contents: read
      id-token: write  # necessário pra assinar com cosign

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Gerar SBOM formato SPDX-JSON
        uses: anchore/sbom-action@v0
        with:
          path: ./app
          format: spdx-json
          output-file: sbom-spdx.json
          artifact-name: sbom-spdx.json

      - name: Gerar SBOM formato CycloneDX-JSON
        run: |
          syft ./app -o cyclonedx-json=sbom-cyclonedx.json
          echo "SBOM CycloneDX gerado: $(cat sbom-cyclonedx.json | python3 -c 'import sys,json; d=json.load(sys.stdin); print(f\"Componentes: {len(d.get(\"components\",[]))}')"

      - name: Gerar SBOM formato CycloneDX-XML
        run: syft ./app -o cyclonedx-xml=sbom-cyclonedx.xml

      - name: Instalar Cosign para assinar SBOM
        uses: sigstore/cosign-installer@v3

      - name: Assinar SBOM com Cosign (keyless)
        run: |
          # Assina usando OIDC token do GitHub Actions — sem chave privada pra guardar
          cosign sign-blob --yes sbom-spdx.json \
            --output-signature sbom-spdx.json.sig \
            --output-certificate sbom-spdx.json.crt
          echo "SBOM assinado com sucesso"

      - name: Upload SBOMs como artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sbom-artifacts
          path: |
            sbom-spdx.json
            sbom-spdx.json.sig
            sbom-spdx.json.crt
            sbom-cyclonedx.json
            sbom-cyclonedx.xml
          retention-days: 90  # manter por 90 dias para auditoria

      - name: Salvar flag de SBOM gerado
        run: echo "sbom_generated=true" >> $GITHUB_OUTPUT
        id: sbom-status

  # ─────────────────────────────────────────────
  # JOB 3: Compliance de licenças
  # Bloqueia dependências com licenças incompatíveis
  # ─────────────────────────────────────────────
  license-compliance:
    name: License Compliance
    runs-on: ubuntu-latest
    needs: sbom-generation

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Instalar dependências da aplicação
        run: |
          cd app
          pip install -r requirements.txt

      - name: Instalar pip-licenses
        run: pip install pip-licenses

      - name: Verificar licenças — Python
        run: |
          pip-licenses \
            --format=json \
            --output-file=licenses-python.json \
            --fail-on="GNU General Public License v2 (GPLv2);GNU General Public License v3 (GPLv3);GNU Affero General Public License v3 (AGPLv3)"

          echo "Licenças encontradas:"
          pip-licenses --format=plain-vertical

      - name: Instalar license-checker (Node.js, se existir package.json)
        run: |
          if [ -f "package.json" ]; then
            npm install -g license-checker
            license-checker \
              --excludePackages "" \
              --failOn "GPL;AGPL;SSPL" \
              --json \
              --out licenses-node.json
          else
            echo "Sem package.json — pulando verificação Node.js"
          fi

      - name: Verificar política de licenças customizada
        run: |
          # Lê a política definida em security/supply-chain/license-policy.yaml
          python3 << 'EOF'
          import json, yaml, sys

          with open("security/supply-chain/license-policy.yaml") as f:
              policy = yaml.safe_load(f)

          blocked = policy.get("blocked", [])
          requires_review = policy.get("requires_review", [])

          with open("licenses-python.json") as f:
              licenses = json.load(f)

          blocked_found = []
          review_needed = []

          for pkg in licenses:
              lic = pkg.get("License", "")
              name = pkg.get("Name", "")
              for b in blocked:
                  if b.lower() in lic.lower():
                      blocked_found.append(f"{name}: {lic}")
              for r in requires_review:
                  if r.lower() in lic.lower():
                      review_needed.append(f"{name}: {lic}")

          if review_needed:
              print(f"⚠ Licenças que precisam de revisão: {review_needed}")

          if blocked_found:
              print(f"✗ Licenças BLOQUEADAS encontradas: {blocked_found}")
              sys.exit(1)

          print("✓ Todas as licenças estão em conformidade com a política")
          EOF

      - name: Upload relatório de licenças
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: license-reports
          path: licenses-*.json
          retention-days: 90

  # ─────────────────────────────────────────────
  # JOB 4: Build e scan do container
  # ─────────────────────────────────────────────
  container-scan:
    name: Container Security - Trivy
    runs-on: ubuntu-latest
    needs: license-compliance
    permissions:
      security-events: write
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build da imagem Docker
        run: |
          docker build \
            -t ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -t ${{ env.IMAGE_NAME }}:latest \
            ./app

      - name: Trivy — scan da imagem (CRITICAL e HIGH)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ env.IMAGE_NAME }}:${{ github.sha }}"
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"
          exit-code: "1"  # falha se encontrar CRITICAL
          ignore-unfixed: false

      - name: Upload resultado Trivy para GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: trivy-container

      - name: Trivy — scan formato JSON (para OPA gate)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ env.IMAGE_NAME }}:${{ github.sha }}"
          format: "json"
          output: "trivy-results.json"
          severity: "CRITICAL,HIGH"
          exit-code: "0"  # não falha aqui — a decisão fica no zero-trust-gate

      - name: Gerar SBOM da imagem Docker
        run: |
          # SBOM separado do filesystem source — cobre o que está na imagem final
          syft ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -o cyclonedx-json=sbom-image-cyclonedx.json

      - name: Upload artifacts do container
        uses: actions/upload-artifact@v4
        with:
          name: container-scan-results
          path: |
            trivy-results.json
            trivy-results.sarif
            sbom-image-cyclonedx.json
          retention-days: 90

  # ─────────────────────────────────────────────
  # JOB 5: SLSA Provenance
  # Gera attestation de origem do artefato
  # ─────────────────────────────────────────────
  slsa-provenance:
    name: SLSA Provenance Level 2
    runs-on: ubuntu-latest
    needs: container-scan
    permissions:
      id-token: write
      contents: read
      actions: read

    # Usa o gerador oficial da OpenSSF / SLSA
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v1.10.0
    with:
      base64-subjects: |
        # subjects calculados a partir dos SBOMs e artefatos
        ${{ needs.container-scan.outputs.artifact-subjects }}
      upload-assets: true
      upload-tag-name: ${{ github.ref_name }}

  # ─────────────────────────────────────────────
  # JOB 6: OPA Policy Check
  # Valida manifests Kubernetes contra políticas Rego
  # ─────────────────────────────────────────────
  opa-policy-check:
    name: OPA - Conftest
    runs-on: ubuntu-latest
    needs: sast

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar conftest
        run: |
          VERSION="0.47.0"
          wget -q "https://github.com/open-policy-agent/conftest/releases/download/v${VERSION}/conftest_${VERSION}_Linux_x86_64.tar.gz"
          tar xzf conftest_${VERSION}_Linux_x86_64.tar.gz
          sudo mv conftest /usr/local/bin/
          conftest --version

      - name: Testar manifests k8s contra políticas OPA
        run: |
          conftest test \
            k8s/deployment.yaml \
            k8s/namespace.yaml \
            --policy security/opa-policies/ \
            --output table \
            --no-color

      - name: Testar pipeline gates
        run: |
          # Verifica se os artefatos necessários existem antes de aprovar deploy
          conftest test \
            --policy security/opa-policies/pipeline-gates.rego \
            --input sbom-spdx.json \
            --output table \
            2>/dev/null || true  # pipeline gate verificado separado no zero-trust-gate

  # ─────────────────────────────────────────────
  # JOB 7: DAST com OWASP ZAP
  # Testa a aplicação rodando em staging
  # ─────────────────────────────────────────────
  dast:
    name: DAST - OWASP ZAP
    runs-on: ubuntu-latest
    needs: container-scan

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Subir aplicação em staging local
        run: |
          docker build -t app-staging ./app
          docker run -d \
            --name app-staging \
            -p 8080:8080 \
            -e ENV=staging \
            app-staging

          # Aguarda aplicação iniciar
          timeout 30 bash -c 'until curl -sf http://localhost:8080/health; do sleep 2; done'
          echo "Aplicação disponível em staging"

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.10.0
        with:
          target: "http://localhost:8080"
          rules_file_name: ".zap/rules.tsv"
          cmd_options: "-a"  # inclui regras alfa
          fail_action: true  # falha se encontrar HIGH ou CRITICAL

      - name: Upload relatório ZAP
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-report
          path: report_html.html
          retention-days: 30

      - name: Parar container de staging
        if: always()
        run: docker stop app-staging && docker rm app-staging

  # ─────────────────────────────────────────────
  # JOB 8: Zero Trust Gate
  # Ponto central de decisão — todos os checks precisam passar
  # ─────────────────────────────────────────────
  zero-trust-gate:
    name: Zero Trust Gate
    runs-on: ubuntu-latest
    needs:
      - sast
      - sbom-generation
      - license-compliance
      - container-scan
      - slsa-provenance
      - opa-policy-check
      - dast
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts de scan
        uses: actions/download-artifact@v4
        with:
          name: container-scan-results
          path: scan-results/

      - name: Download SBOMs
        uses: actions/download-artifact@v4
        with:
          name: sbom-artifacts
          path: sbom-results/

      - name: Verificar gate — SBOM presente
        run: |
          if [ ! -f sbom-results/sbom-spdx.json ]; then
            echo "✗ GATE FALHOU: SBOM não encontrado"
            exit 1
          fi
          echo "✓ SBOM presente e verificado"

      - name: Verificar gate — sem CRITICAL não mitigado
        run: |
          python3 << 'EOF'
          import json, sys

          with open("scan-results/trivy-results.json") as f:
              data = json.load(f)

          critical_count = 0
          for result in data.get("Results", []):
              for vuln in result.get("Vulnerabilities", []):
                  if vuln.get("Severity") == "CRITICAL":
                      # Verifica se está na lista de exceções (mitigado)
                      # TODO: implementar lookup na lista de mitigações aprovadas
                      critical_count += 1
                      print(f"  CRITICAL: {vuln.get('VulnerabilityID')} em {vuln.get('PkgName')}")

          if critical_count > 0:
              print(f"✗ GATE FALHOU: {critical_count} vulnerabilidades CRITICAL não mitigadas")
              sys.exit(1)

          print("✓ Sem vulnerabilidades CRITICAL não mitigadas")
          EOF

      - name: Verificar gate — assinatura SBOM
        run: |
          if [ -f sbom-results/sbom-spdx.json.sig ]; then
            echo "✓ Assinatura do SBOM presente"
          else
            echo "⚠ Assinatura do SBOM não encontrada — verificar processo de assinatura"
            # Não bloqueia ainda — apenas avisa (TODO: tornar obrigatório na v2)
          fi

      - name: Gate aprovado — liberado para deploy
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✓ ZERO TRUST GATE: TODOS OS CHECKS PASSARAM"
          echo "✓ SAST: OK"
          echo "✓ SBOM: Gerado e assinado"
          echo "✓ Licenças: Em conformidade"
          echo "✓ Container: Sem CRITICAL"
          echo "✓ SLSA: Provenance gerada"
          echo "✓ OPA: Políticas satisfeitas"
          echo "✓ DAST: Sem vulnerabilidades altas"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Deploy autorizado para: ${{ github.ref_name }}"

  # ─────────────────────────────────────────────
  # JOB 9: Deploy
  # Só executa se o Zero Trust Gate passou
  # ─────────────────────────────────────────────
  deploy:
    name: Deploy - Kubernetes
    runs-on: ubuntu-latest
    needs: [zero-trust-gate]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: https://app.example.com

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "v1.28.0"

      - name: Autenticar no cluster (AKS)
        uses: azure/aks-set-context@v3
        with:
          resource-group: ${{ secrets.AKS_RESOURCE_GROUP }}
          cluster-name: ${{ secrets.AKS_CLUSTER_NAME }}
          admin: false
          use-kubelogin: true

      - name: Deploy dos manifests Kubernetes
        run: |
          # Aplica namespace e RBAC primeiro
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f zero-trust/rbac/rbac-policies.yaml

          # Zero Trust network antes do deploy da aplicação
          kubectl apply -f zero-trust/network-policies/default-deny.yaml
          kubectl apply -f zero-trust/network-policies/allow-dns.yaml
          kubectl apply -f zero-trust/network-policies/app-policies.yaml

          # mTLS via Istio
          kubectl apply -f zero-trust/mtls/peer-authentication.yaml
          kubectl apply -f zero-trust/mtls/authorization-policy.yaml

          # Deploy da aplicação
          kubectl set image deployment/zero-trust-app \
            app=${{ env.REGISTRY }}/${{ github.repository }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

          # Aguarda rollout
          kubectl rollout status deployment/zero-trust-app \
            --namespace=production \
            --timeout=5m

      - name: Verificar saúde pós-deploy
        run: |
          kubectl get pods -n production -l app=zero-trust-app
          kubectl describe deployment zero-trust-app -n production | grep -A5 "Conditions:"
