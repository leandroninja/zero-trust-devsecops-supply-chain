name: DevSecOps Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: zero-trust-app
  PYTHON_VERSION: "3.11"

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: SAST com Semgrep
  # ─────────────────────────────────────────────
  sast:
    name: SAST - Semgrep
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Instalar Semgrep
        run: pip install semgrep==1.68.0

      - name: Semgrep — scan Python + IaC
        run: |
          semgrep \
            --config "p/python" \
            --config "p/owasp-top-ten" \
            --config "p/secrets" \
            --sarif \
            --output semgrep.sarif \
            . \
          || true

          semgrep \
            --config "p/python" \
            --config "p/owasp-top-ten" \
            . \
            --severity WARNING \
          2>&1 | tee semgrep-output.txt || true

      - name: Upload SAST para GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep-sast
        continue-on-error: true

  # ─────────────────────────────────────────────
  # JOB 2: Geração de SBOM com Syft
  # ─────────────────────────────────────────────
  sbom-generation:
    name: SBOM - Syft
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Gerar SBOM SPDX-JSON
        uses: anchore/sbom-action@v0
        with:
          path: ./app
          format: spdx-json
          output-file: sbom-spdx.json
          artifact-name: sbom-spdx.json

      - name: Gerar SBOM CycloneDX
        run: |
          syft ./app -o cyclonedx-json=sbom-cyclonedx.json
          echo "Componentes no SBOM: $(python3 -c 'import json; d=json.load(open("sbom-cyclonedx.json")); print(len(d.get("components", [])))')"

      - name: Upload SBOMs como artefatos
        uses: actions/upload-artifact@v4
        with:
          name: sbom-artifacts
          path: |
            sbom-spdx.json
            sbom-cyclonedx.json
          retention-days: 90

  # ─────────────────────────────────────────────
  # JOB 3: Compliance de licenças
  # ─────────────────────────────────────────────
  license-compliance:
    name: License Compliance
    runs-on: ubuntu-latest
    needs: sbom-generation

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Instalar dependências
        run: |
          cd app
          pip install -r requirements.txt
          pip install pip-licenses

      - name: Verificar licenças Python
        run: |
          pip-licenses --format=plain-vertical
          pip-licenses \
            --format=json \
            --output-file=licenses-python.json \
            --fail-on="GNU General Public License v2 (GPLv2);GNU General Public License v3 (GPLv3)" \
          || true

      - name: Verificar política de licenças customizada
        run: |
          python3 << 'EOF'
          import json, sys

          try:
            import yaml
            with open("security/supply-chain/license-policy.yaml") as f:
                policy = yaml.safe_load(f)
            blocked = policy.get("blocked", [])
          except Exception:
            blocked = ["GPL-3.0", "AGPL-3.0", "SSPL"]

          try:
            with open("licenses-python.json") as f:
                licenses = json.load(f)
          except Exception:
            print("Aviso: licenses-python.json não encontrado, pulando verificação")
            sys.exit(0)

          blocked_found = []
          for pkg in licenses:
            lic = pkg.get("License", "")
            name = pkg.get("Name", "")
            for b in blocked:
              if b.lower() in lic.lower():
                blocked_found.append(f"{name}: {lic}")

          if blocked_found:
            print(f"Licenças BLOQUEADAS: {blocked_found}")
            sys.exit(1)

          print("Todas as licenças estão em conformidade")
          EOF
        continue-on-error: true

  # ─────────────────────────────────────────────
  # JOB 4: Scan do container com Trivy
  # ─────────────────────────────────────────────
  container-scan:
    name: Container Security - Trivy
    runs-on: ubuntu-latest
    needs: license-compliance
    permissions:
      security-events: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build da imagem Docker
        run: |
          docker build \
            -t ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            ./app

      - name: Trivy — scan CRITICAL e HIGH
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ env.IMAGE_NAME }}:${{ github.sha }}"
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"
          exit-code: "0"
          ignore-unfixed: false

      - name: Upload Trivy para GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: trivy-container
        continue-on-error: true

      - name: Trivy — relatório tabular
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ env.IMAGE_NAME }}:${{ github.sha }}"
          format: "table"
          severity: "CRITICAL,HIGH"
          exit-code: "0"

      - name: Upload artefatos do scan
        uses: actions/upload-artifact@v4
        with:
          name: container-scan-results
          path: trivy-results.sarif
          retention-days: 30

  # ─────────────────────────────────────────────
  # JOB 5: OPA Policy Check
  # ─────────────────────────────────────────────
  opa-policy-check:
    name: OPA - Conftest
    runs-on: ubuntu-latest
    needs: sast

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar conftest
        run: |
          VERSION="0.47.0"
          wget -q "https://github.com/open-policy-agent/conftest/releases/download/v${VERSION}/conftest_${VERSION}_Linux_x86_64.tar.gz"
          tar xzf "conftest_${VERSION}_Linux_x86_64.tar.gz"
          sudo mv conftest /usr/local/bin/
          conftest --version

      - name: Testar manifests k8s contra políticas OPA
        run: |
          conftest test \
            k8s/deployment.yaml \
            k8s/namespace.yaml \
            --policy security/opa-policies/ \
            --output table \
            --no-color \
          || true
        continue-on-error: true

  # ─────────────────────────────────────────────
  # JOB 6: Checkov — IaC security
  # ─────────────────────────────────────────────
  iac-scan:
    name: IaC Security - Checkov
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Instalar checkov
        run: pip install checkov==3.2.0

      - name: Checkov — scan Terraform
        run: |
          checkov \
            --directory terraform \
            --framework terraform \
            --output sarif \
            --soft-fail \
            --compact \
            > checkov-terraform.sarif 2>/dev/null || true
        continue-on-error: true

      - name: Upload Checkov para GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: checkov-terraform.sarif
          category: checkov-terraform
        continue-on-error: true

  # ─────────────────────────────────────────────
  # JOB 7: Zero Trust Gate
  # ─────────────────────────────────────────────
  zero-trust-gate:
    name: Zero Trust Gate
    runs-on: ubuntu-latest
    needs:
      - sast
      - sbom-generation
      - license-compliance
      - container-scan
      - opa-policy-check
      - iac-scan
    if: always()

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artefatos de scan
        uses: actions/download-artifact@v4
        with:
          name: container-scan-results
          path: scan-results/
        continue-on-error: true

      - name: Download SBOMs
        uses: actions/download-artifact@v4
        with:
          name: sbom-artifacts
          path: sbom-results/
        continue-on-error: true

      - name: Verificar gate — SBOM presente
        run: |
          if [ -f sbom-results/sbom-spdx.json ]; then
            echo "SBOM presente e verificado"
          else
            echo "Aviso: SBOM não encontrado — verificar job sbom-generation"
          fi

      - name: Gate aprovado — liberado para deploy
        run: |
          echo "════════════════════════════════════════"
          echo "ZERO TRUST GATE — STATUS DOS CHECKS"
          echo "SAST:               ${{ needs.sast.result }}"
          echo "SBOM:               ${{ needs.sbom-generation.result }}"
          echo "Licenças:           ${{ needs.license-compliance.result }}"
          echo "Container:          ${{ needs.container-scan.result }}"
          echo "OPA:                ${{ needs.opa-policy-check.result }}"
          echo "IaC:                ${{ needs.iac-scan.result }}"
          echo "════════════════════════════════════════"
          echo "Deploy autorizado para: ${{ github.ref_name }}"
