name: Dependency Review

on:
  pull_request:
    branches: [main, develop]

# Detecta mudanças em arquivos de dependência e bloqueia
# dependências novas com vulnerabilidades ou licenças problemáticas.
#
# Funciona comparando o snapshot de dependências da base (main)
# com o snapshot do PR — só o que mudou é analisado.
#
# Referência: LFEL1007 — Automating Supply Chain Security
#             LFC191 — Open Source Licensing

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write  # para comentar no PR

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          # ─── Configurações de vulnerabilidades ──────────────────────────
          # Bloqueia qualquer dependência nova com severidade >= high
          fail-on-severity: high

          # Permite dependências com severidade moderate (apenas aviso)
          warn-on-severity: moderate

          # Bloqueia dependências com score OpenSSF baixo (abaixo de 3)
          # Indica projeto abandonado ou com práticas ruins de segurança
          warn-on-openssf-scorecard-level: 3

          # ─── Configurações de licenças ───────────────────────────────────
          # Licenças explicitamente bloqueadas
          # Motivo: incompatibilidade com uso comercial / copyleft forte
          deny-licenses: >-
            GPL-2.0,
            GPL-2.0-only,
            GPL-2.0-or-later,
            GPL-3.0,
            GPL-3.0-only,
            GPL-3.0-or-later,
            AGPL-3.0,
            AGPL-3.0-only,
            AGPL-3.0-or-later,
            SSPL-1.0,
            BUSL-1.1

          # Licenças explicitamente permitidas (whitelist)
          allow-licenses: >-
            MIT,
            Apache-2.0,
            BSD-2-Clause,
            BSD-3-Clause,
            ISC,
            0BSD,
            Unlicense,
            CC0-1.0,
            Python-2.0

          # ─── Comentários no PR ────────────────────────────────────────────
          # Posta resumo de mudanças no PR como comentário
          comment-summary-in-pr: always

          # ─── Dependências de desenvolvimento ─────────────────────────────
          # NÃO ignora dependências de dev — ferramentas de dev também podem
          # introduzir riscos de supply chain (ver: event-stream incident)
          # allow-ghsas: []  # permite IDs GHSA específicos se necessário

      - name: Comentário de aprovação no PR
        uses: actions/github-script@v7
        if: success()
        with:
          script: |
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            // Evita comentários duplicados
            const existingComment = comments.find(c =>
              c.body.includes('Dependency Review passou')
            );

            if (!existingComment) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: [
                  '## Dependency Review passou',
                  '',
                  'Nenhuma dependência nova com vulnerabilidades HIGH/CRITICAL ou licenças bloqueadas.',
                  '',
                  '**Checks realizados:**',
                  '- Vulnerabilidades: sem HIGH ou CRITICAL',
                  '- Licenças: sem GPL/AGPL/SSPL',
                  '- OpenSSF Scorecard: projetos com score >= 3',
                ].join('\n')
              });
            }
